<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monument</title>
    <link rel="stylesheet" href="css/monument.css">
</head>
<body>

    <!-- Main Monument View -->
    <main id="monument">
        <h1 class="title">
            <img src="assets/monument.png" alt="Monument Icon" class="monument-icon">
            monument
        </h1>

        <div class="search-container">
            <span class="search-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3" fill="currentColor"></circle>
                </svg>
            </span>
            <input
                id="search"
                type="search"
                placeholder="Search Monument or type a query..."
                autocomplete="off"
            >
        </div>

        <!-- Shortcuts Bar (Icons Only) -->
        <div class="shortcuts">
            <button class="shortcut-item" data-module="starlight" title="Star Arcade">
                <div class="shortcut-icon">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="#991b1b">
                        <path d="M12 2 C12 8 16 12 22 12 C16 12 12 16 12 22 C12 16 8 12 2 12 C8 12 12 8 12 2 Z"/>
                    </svg>
                </div>
            </button>
            <button class="shortcut-item" data-module="scribbles" title="Scribbles' Community">
                <div class="shortcut-icon">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#991b1b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="8" y1="13" x2="16" y2="13"></line>
                        <line x1="8" y1="17" x2="12" y2="17"></line>
                    </svg>
                </div>
            </button>
        </div>
    </main>

    <!-- SeekEngine Browser Overlay -->
    <div id="seek-browser" class="seek-browser hidden">
        <header class="browser-topbar">
            <div class="browser-nav-group">
                <button id="browser-home-btn" class="browser-btn" title="Home (Back to Monument)">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </button>
            </div>
            <div class="browser-address-bar">
                <span class="lock-icon">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </span>
                <!-- Editable address bar input -->
                <input id="browser-url-input" class="url-input" type="text" value="seek://about" spellcheck="false" autocomplete="off">
            </div>
        </header>

        <div class="browser-content">
            <div id="browser-view-container" class="browser-view">
                <!-- Loaded dynamically by JS -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="monument-footer">
        <span>Managed by</span>
        <span class="footer-entity">
            <svg class="footer-svg star-svg" viewBox="0 0 24 24" width="14" height="14" fill="#991b1b">
                <path d="M12 2 C12 8 16 12 22 12 C16 12 12 16 12 22 C12 16 8 12 2 12 C8 12 12 8 12 2 Z"/>
            </svg>
            Starlight
        </span>
        <span>&</span>
        <span class="footer-entity">
            <svg class="footer-svg moon-svg" viewBox="0 0 24 24" width="14" height="14" fill="#991b1b">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            Moonlight
        </span>
        <span class="version-tag">v0.1.0</span>
    </footer>

    <!-- Core Controller -->
    <script src="js/monument.js"></script>

    <!-- Connection & Storage -->
    <script src="js/moonlight.js"></script>
    <script src="js/bob.js"></script>

    <!-- Modules -->
    <script src="js/seek.js"></script>
    <script src="js/scribbles.js"></script>
    <script src="js/starlight.js"></script>

</body>
</html>
