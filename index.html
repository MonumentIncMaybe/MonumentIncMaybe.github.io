<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monument</title>
    <!-- SVG Favicon (Monument Obelisk) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23f59e0b'><path d='M12 2L8 12h8z'/><path d='M8 12l-1 4h10l-1-4z'/><rect x='6' y='16' width='12' height='3' rx='1'/><path d='M6 18l-4 2-1 3M18 18l4 2 1 3' stroke='%23f59e0b' stroke-width='1.5'/></svg>">
    <link rel="stylesheet" href="css/monument.css">
</head>
<body>

    <main id="monument">
        <h1 class="title">monument</h1>

        <div class="search-container">
            <span class="search-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </span>
            <input
                id="search"
                type="search"
                placeholder="Search Monument..."
                autocomplete="off"
            >
        </div>

        <!-- NEW: Shortcuts Bar -->
        <div class="shortcuts">
            <button class="shortcut-item" data-module="starlight">
                <div class="shortcut-icon">✦</div>
                <span class="shortcut-label">Star Arcade</span>
            </button>
            <button class="shortcut-item" data-module="scribbles">
                <div class="shortcut-icon">✍︎</div>
                <span class="shortcut-label">Scribbles' Community</span>
            </button>
        </div>
    </main>

    <!-- Core Controller -->
    <script src="js/monument.js"></script>

    <!-- Connection & Storage -->
    <script src="js/moonlight.js"></script>
    <script src="js/bob.js"></script>

    <!-- Modules (DOORS Entities) -->
    <script src="js/seek.js"></script>
    <script src="js/scribbles.js"></script>
    <script src="js/starlight.js"></script>

</body>
</html>
