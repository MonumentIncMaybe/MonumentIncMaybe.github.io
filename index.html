<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monument</title>
    <!-- SVG Favicon (Monument Obelisk) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23f59e0b'><path d='M12 2L8 12h8z'/><path d='M8 12l-1 4h10l-1-4z'/><rect x='6' y='16' width='12' height='3' rx='1'/><path d='M6 18l-4 2-1 3M18 18l4 2 1 3' stroke='%23f59e0b' stroke-width='1.5'/></svg>">
    <link rel="stylesheet" href="css/monument.css">
</head>
<body>

<main id="monument">
        <h1 class="title">
            <!-- Monument Obelisk SVG -->
            <svg class="monument-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M12 2 L8 12 L16 12 Z" fill="#d97706" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1.5"/>
                <path d="M8 12 L7 16 L17 16 L16 12 Z" fill="#b45309" fill-opacity="0.4" stroke="#f59e0b" stroke-width="1.5"/>
                <rect x="6" y="16" width="12" height="3" rx="1" fill="#78350f" stroke="#f59e0b" stroke-width="1.5"/>
                <path d="M6 18 L2 20 L1 23" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M7 19 L4 21 L3 23" stroke="#d97706" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
                <path d="M18 18 L22 20 L23 23" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M17 19 L20 21 L21 23" stroke="#d97706" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
            </svg>
            monument
        </h1>

        <div class="search-container">
            <span class="search-icon">
                <!-- Seek Eye Search Icon -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3" fill="currentColor"></circle>
                </svg>
            </span>
            <input
                id="search"
                type="search"
                placeholder="Search Monument or type a query..."
                autocomplete="off"
            >
        </div>

        <!-- Shortcuts Bar -->
        <div class="shortcuts">
            <button class="shortcut-item" data-module="starlight">
                <div class="shortcut-icon starlight-glow">
                    <!-- Starlight 4-Point Star SVG -->
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="#facc15">
                        <path d="M12 2 C12 8 16 12 22 12 C16 12 12 16 12 22 C12 16 8 12 2 12 C8 12 12 8 12 2 Z"/>
                    </svg>
                </div>
                <span class="shortcut-label">Star Arcade</span>
            </button>
            <button class="shortcut-item" data-module="scribbles">
                <div class="shortcut-icon scribbles-glow">
                    <!-- Scribbles Paper Sheet SVG -->
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#e4e4e7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="8" y1="13" x2="16" y2="13"></line>
                        <line x1="8" y1="17" x2="12" y2="17"></line>
                    </svg>
                </div>
                <span class="shortcut-label">Scribbles' Community</span>
            </button>
        </div>
    </main>

    <!-- SeekEngine Browser Overlay -->
    <div id="seek-browser" class="seek-browser hidden">
        <header class="browser-topbar">
            <div class="browser-nav-group">
                <button id="browser-home-btn" class="browser-btn" title="Home (Back to Monument)">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </button>
            </div>
            <div class="browser-address-bar">
                <span class="lock-icon">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </span>
                <span id="browser-url-display" class="url-text">seek://about</span>
            </div>
        </header>

        <div class="browser-content">
            <div id="browser-view-container" class="browser-view">
                <!-- Dynamically loaded depending on seek:// route -->
            </div>
        </div>
    </div>

    <!-- Footer managed by Starlight & Moonlight -->
    <footer class="monument-footer">
        <span>Managed by</span>
        <span class="footer-entity">
            <svg class="footer-svg star-svg" viewBox="0 0 24 24" width="14" height="14" fill="#facc15">
                <path d="M12 2 C12 8 16 12 22 12 C16 12 12 16 12 22 C12 16 8 12 2 12 C8 12 12 8 12 2 Z"/>
            </svg>
            Starlight
        </span>
        <span>&</span>
        <span class="footer-entity">
            <svg class="footer-svg moon-svg" viewBox="0 0 24 24" width="14" height="14" fill="#38bdf8">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            Moonlight
        </span>
        <span class="version-tag">v0.1.0</span>
    </footer>

    <!-- Core Controller -->
    <script src="js/monument.js"></script>

    <!-- Connection & Storage -->
    <script src="js/moonlight.js"></script>
    <script src="js/bob.js"></script>

    <!-- Modules (DOORS Entities) -->
    <script src="js/seek.js"></script>
    <script src="js/scribbles.js"></script>
    <script src="js/starlight.js"></script>

</body>
</html>
