<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monument</title>
    <!-- Page icon using monument.png, no .ico reference -->
    <link rel="icon" type="image/png" href="assets/monument.png">
    <link rel="stylesheet" href="css/monument.css">
</head>
<body>

    <!-- Main Monument View -->
    <main id="monument">
        <h1 class="title">
            <img src="assets/monument.png" alt="Monument Icon" class="monument-icon">
            monument
        </h1>

        <div class="search-container">
            <span class="search-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </span>
            <input
                id="search"
                type="search"
                placeholder="Search Monument..."
                autocomplete="off"
            >
        </div>

        <div class="shortcuts">
            <button class="shortcut-item" data-module="starlight">
                <div class="shortcut-icon starlight-glow">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="#facc15">
                        <path d="M12 2 C12 8 16 12 22 12 C16 12 12 16 12 22 C12 16 8 12 2 12 C8 12 12 8 12 2 Z"/>
                    </svg>
                </div>
                <span class="shortcut-label">Star Arcade</span>
            </button>
            <button class="shortcut-item" data-module="scribbles">
                <div class="shortcut-icon scribbles-glow">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#e4e4e7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="8" y1="13" x2="16" y2="13"></line>
                        <line x1="8" y1="17" x2="12" y2="17"></line>
                    </svg>
                </div>
                <span class="shortcut-label">Scribbles' Community</span>
            </button>
        </div>
    </main>

    <!-- SeekEngine Browser Overlay -->
    <div id="seek-browser" class="seek-browser hidden">
        <header class="browser-topbar">
            <!-- Left Controls: Home Button -->
            <div class="browser-nav-group">
                <button id="browser-home-btn" class="browser-btn" title="Home">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </button>
            </div>

            <!-- Address Bar / Status showing what you're on (no search engine logic yet) -->
            <div class="browser-address-bar">
                <span class="lock-icon">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </span>
                <span id="browser-url-display" class="url-text">seek://wip</span>
            </div>
            <!-- Far-right buttons removed as requested -->
        </header>

        <!-- Actual Browser Page Content ("WIP") -->
        <div class="browser-content">
            <div class="wip-container">
                <h1>WIP</h1>
                <p>This section of the Seek browser is currently a work in progress.</p>
            </div>
        </div>
    </div>

    <script src="js/monument.js"></script>
</body>
</html>
